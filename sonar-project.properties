# Basic project info
sonar.projectKey=ST10254797_insy7314-poe-backend
sonar.organization=st10254797
sonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js
sonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**
sonar.inclusions=**/*.js

# Force JS only
sonar.language=js

# Disable ALL security and multi-language analyzers
sonar.security.enabled=false
sonar.javascript.security.enabled=false
sonar.javascript.node.maxspace=4096
sonar.skipPackageDesign=true
sonar.cfamily.build-wrapper-output.bypass=true

# 💣 Disable Jasmin (the thing freezing)
sonar.javascript.jasmin.enabled=false
sonar.javascript.jasmin.skip=true

# Reduce verbosity
sonar.log.level=WARN
sonar.verbose=false
