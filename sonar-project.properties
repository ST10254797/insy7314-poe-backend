# --- Project Identification ---
sonar.projectKey=ST10254797_insy7314-poe-backend
sonar.organization=st10254797
sonar.projectName=insy7314-poe-backend
sonar.projectVersion=1.0
sonar.branch.name=master

# --- Source Files ---
# Use folders instead of individual files to avoid path resolution bugs
sonar.sources=app.js,server.js,Controllers,Routes,Middleware,Models,utils

# --- Test & Coverage ---
sonar.tests=__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.test.inclusions=__tests__/**/*.test.js

# --- Encoding & SCM ---
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# --- Exclusions ---
sonar.exclusions=node_modules/**,coverage/**,__tests__/**

# --- Optional Logging ---
# Helps with debugging paths and JS analysis
sonar.log.level=DEBUG
