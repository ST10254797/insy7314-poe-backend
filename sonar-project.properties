# --- Project Identification ---
sonar.projectKey=ST10254797_insy7314-poe-backend
sonar.organization=st10254797
sonar.projectName=insy7314-poe-backend
sonar.projectVersion=1.0
sonar.branch.name=master
sonar.host.url=https://sonarcloud.io

# --- Source Files ---
sonar.sources=.
sonar.inclusions=app.js,server.js,Controllers/**,Routes/**,Middleware/**,Models/**,utils/**

# --- Test & Coverage ---
sonar.tests=__tests__
sonar.test.inclusions=__tests__/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Encoding & SCM ---
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true

# --- Exclusions ---
# Exclude node_modules, coverage, tests, and authRoute.js (stuck file)
sonar.exclusions=node_modules/**,coverage/**,__tests__/**,Routes/authRoute.js

# --- Logging ---
sonar.log.level=DEBUG
