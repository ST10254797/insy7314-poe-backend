# Basic project info
sonar.projectKey=ST10254797_insy7314-poe-backend
sonar.organization=st10254797

# Source configuration
sonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js
sonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**

# Remove these problematic lines:
# sonar.inclusions=**/*.js  # ❌ Redundant with sonar.sources
# sonar.language=js         # ❌ This forces single-language mode but can cause issues

# JavaScript specific settings
sonar.javascript.node.maxspace=4096

# Disable unnecessary analyzers
sonar.cfamily.build-wrapper-output.bypass=true
sonar.cpd.exclusions=**/*

# Critical: Disable Jasmin security analysis (the main culprit)
sonar.javascript.jasmin.enabled=false

# Reduce verbosity
sonar.log.level=WARN
sonar.verbose=false

# Performance optimizations
sonar.scanner.metadataFilePath=.scannerwork/sonar-report.txt
sonar.scanner.dumpToFile=.scannerwork/debug-dump.txt