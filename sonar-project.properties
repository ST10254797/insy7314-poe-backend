# Basic project info
sonar.projectKey=ST10254797_insy7314-poe-backend
sonar.organization=st10254797

# Only backend source folders
sonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js

# Exclude unnecessary files/folders
sonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**

# Only JS/TS scan
sonar.inclusions=**/*.js,**/*.ts
sonar.language=js

# Optional: disable JS security checks to speed up scan
sonar.javascript.security.enabled=false
sonar.javascript.file.suspiciousCode=false

# Force UTF-8 encoding
sonar.sourceEncoding=UTF-8
