name: Backend CI  SonarCloud Scan

on:
  push:
    branches:
      - master
    paths:
      - '**'
  pull_request:
    branches:
      - master

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js (v18)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run package vulnerability scan
      - name: Run npm audit
        run: npm audit --audit-level=moderate

      # 5️⃣ Run linting
      - name: Run ESLint
        run: npm run lint

      # 6️⃣ Run unit/integration tests with coverage
      - name: Run tests
        run: npm test

      # 7️⃣ Install SonarScanner CLI
      - name: Install SonarScanner
        run: |
          npm install -g sonar-scanner
          sonar-scanner --version

      # 8️⃣ SonarCloud Scan (Verbose)
      - name: SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.verbose=true \
            -Dsonar.projectBaseDir=. \
            -Dsonar.scanner.forceAnalysis=true \
            | tee sonar.log
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 9️⃣ Upload SonarCloud logs
      - name: Upload SonarCloud Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-debug-logs
          path: sonar.log
          retention-days: 7

      # 🔟 Finish step
      - name: Finish Job
        run: echo "✅ Backend CI pipeline completed."
