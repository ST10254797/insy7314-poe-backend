name: SonarCloud JS Scan

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo (shallow clone)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      # 2️⃣ Use Node 18
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'  # ✅ Enable npm caching

      # 3️⃣ Install dependencies with cache
      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci --ignore-scripts --no-audit --prefer-offline

      # 4️⃣ Run SonarCloud scan (optimized)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=st10254797
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js
            -Dsonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**,**/coverage/**
            -Dsonar.coverage.exclusions=**/*
            -Dsonar.cpd.exclusions=**/*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scanner.metadataFilePath=./sonar-report.txt
            -Dsonar.analysis.mode=preview
            -Dsonar.verbose=false