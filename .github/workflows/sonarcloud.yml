name: SonarCloud Analysis

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history helps Sonar detect changes

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci  # faster and more deterministic than npm install

      - name: Show debug info
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "Java version:"
          java -version
          echo "Disk usage:"
          df -h
          echo "Memory info:"
          free -h

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_OPTS: "-Xmx4096m -Xms1024m -Dsonar.verbose=true"
        with:
          args: >
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.organization=st10254797
            -Dsonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js
            -Dsonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**
            -Dsonar.inclusions=**/*.js
            -Dsonar.language=js
            -Dsonar.javascript.security.enabled=false
            -Dsonar.javascript.file.suspiciousCode=false
