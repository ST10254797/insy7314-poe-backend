name: SonarCloud JS Scan

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Use Node 18
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install dependencies (quietly)
      - run: npm ci --ignore-scripts --no-audit

      # 4️⃣ Run SonarCloud scan (pure JS mode)
      - name: SonarCloud Scan (JS only)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=st10254797
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.sources=Controllers,Middleware,Models,Routes,utils,app.js,server.js
            -Dsonar.exclusions=node_modules/**,dist/**,build/**,**/*.spec.js,**/*.test.js,.github/**,utils/someFile.js
            -Dsonar.inclusions=**/*.js
            -Dsonar.language=js
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.cfamily.build-wrapper-output.bypass=true
            -Dsonar.skipPackageDesign=true
            -Dsonar.javascript.node.maxspace=4096
            -Dsonar.log.level=WARN
            -Dsonar.verbose=false
            -Dsonar.security.enabled=false
            -Dsonar.javascript.security.enabled=false
            -Dsonar.javascript.jasmin.skip=true
            -Dsonar.javascript.node.analysis-strategy=skip
            -Dsonar.security.nodejs.analyzer.skip=true

