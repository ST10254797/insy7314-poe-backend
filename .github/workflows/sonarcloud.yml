name: SonarCloud Scan

on:
  push:
    branches:
      - master

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci --ignore-scripts --no-audit

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=st10254797
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.sources=app.js,server.js
            -Dsonar.exclusions=node_modules/**,**/*.spec.js,**/*.test.js,.github/**,coverage/**,dist/**,build/**
            -Dsonar.cpd.exclusions=**/*
            -Dsonar.scm.disabled=true
            -Dsonar.qualitygate.wait=false