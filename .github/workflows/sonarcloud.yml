name: SonarCloud Scan

on:
  push:
    branches:
      - master

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci --ignore-scripts --no-audit
      
      - run: npx jest --coverage --coverageReporters=lcov

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@2.2.0  # FIXED: lowercase 's'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=st10254797
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.sources=.
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/__tests__/**,**/*.test.js,**/*.spec.js,.github/**,coverage/lcov-report/**
            -Dsonar.scm.disabled=true
            -Dsonar.qualitygate.wait=true