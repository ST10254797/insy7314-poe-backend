name: SonarCloud Scan

on:
  push:
    branches:
      - master

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan (Minimum Viable)
        uses: SonarSource/sonarcloud-github-action@v2.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=st10254797
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.sources=app.js,server.js
            -Dsonar.exclusions=**/*
            -Dsonar.coverage.exclusions=**/*
            -Dsonar.cpd.exclusions=**/*
            -Dsonar.scm.disabled=true