name: Backend SonarCloud Scan

on:
  push:
    branches: [master]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text-summary

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6  # ← SAME AS FRONTEND
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend
            -Dsonar.organization=st10254797
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.scm.disabled=true