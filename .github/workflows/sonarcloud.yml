name: Backend SonarCloud Scan

on:
  push:
    branches:
      - master
    paths:
      - '**'

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js (v18)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 3.5️⃣ Run vulnerability scan
      - name: Run vulnerability scan (npm audit)
        run: npm audit --audit-level=moderate

      # 4️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: npm test

      # 5️⃣ Install Sonar Scanner CLI
      - name: Install SonarScanner
        run: |
          npm install -g sonar-scanner
          sonar-scanner --version

      # 6️⃣ SonarCloud Scan (Verbose Logging)
      - name: SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.verbose=true \
            -Dsonar.projectBaseDir=. \
            -Dsonar.scanner.forceAnalysis=true \
            | tee sonar.log
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 7️⃣ Upload full scan logs
      - name: Upload SonarCloud Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-debug-logs
          path: sonar.log
          retention-days: 7

      # 8️⃣ Finish step
      - name: Finish Job
        run: echo "✅ SonarCloud analysis and vulnerability scan completed."
