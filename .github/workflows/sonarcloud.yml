name: Backend SonarCloud Scan

on:
  push:
    branches:
      - master
    paths:
      - '**'

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js (v18)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests with coverage
      - name: Run tests with coverage
        run: npm test

      # 5️⃣ Install Sonar Scanner CLI
      - name: Install SonarScanner
        run: |
          npm install -g sonar-scanner
          sonar-scanner --version

      # 6️⃣ Set memory limits for Node & Java
      - name: Configure memory
        run: |
          echo "NODE_OPTIONS=--max-old-space-size=2048" >> $GITHUB_ENV
          echo "SONAR_SCANNER_OPTS=-Xmx1024m" >> $GITHUB_ENV

      # 7️⃣ SonarCloud Scan (Verbose + Log Capture)
      - name: SonarCloud Scan (Verbose Logging)
        run: |
          echo "Starting SonarCloud scan in verbose mode..."
          sonar-scanner \
            -Dsonar.verbose=true \
            -Dsonar.projectBaseDir=. \
            -Dsonar.scanner.forceAnalysis=true \
            | tee sonar.log
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 8️⃣ Upload full scan logs (GitHub Artifact v4)
      - name: Upload SonarCloud Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarcloud-debug-logs
          path: sonar.log
          retention-days: 7

      # 9️⃣ Confirmation step
      - name: Finish Job
        run: echo "✅ SonarCloud analysis completed (or logs uploaded if it failed)."
