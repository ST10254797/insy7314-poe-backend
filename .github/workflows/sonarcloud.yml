name: SonarCloud Scan

on:
  push:
    branches:
      - master

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

      - name: SonarCloud Scan
        run: |
          npx sonar-scanner \
            -Dsonar.organization=st10254797 \
            -Dsonar.projectKey=ST10254797_insy7314-poe-backend \
            -Dsonar.sources=. \
            -Dsonar.exclusions=node_modules/**,coverage/**,__tests__/** \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.tests=__tests__ \
            -Dsonar.coverage.exclusions=**/* \
            -Dsonar.cpd.exclusions=**/* \
            -Dsonar.cfamily.build-wrapper-content.ignore=true \
            -Dsonar.cfamily.gcov.ignore=true \
            -Dsonar.scm.disabled=true \
            -Dsonar.scm.provider=git
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}